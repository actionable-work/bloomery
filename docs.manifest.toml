roots = ["README.md", "packages/rust/libs/docs/content/src/docs/*.md"]

[[surfaces]]
features = ["CLI/INTERFACE", "NIX/SOURCES", "NIXLIB/FLAKE", "NIXLIB/GRAPH"]
path = "README.md"

[[surfaces]]
features = ["CLI/CONFIG", "NIXLIB/FLAKE"]
path = "packages/rust/libs/docs/content/src/docs/api.md"

[[surfaces]]
features = [
  "CLI/BUILD",
  "CLI/CHECK",
  "CLI/CONFIG",
  "CLI/DISK",
  "CLI/REVIEW",
  "CLI/SPEC",
  "DOCS/CONSISTENCY",
  "DOCS/CONTENT",
  "DOCS/SERVER",
  "DOCS/UI",
  "NIXLIB/GRAPH",
  "NIXLIB/OPTIMIZE",
  "PARSER/CONFIGURATION",
  "PARSER/REQUIREMENTS",
  "PARSER/SCANNING",
  "PARSER/WORKSPACE",
  "REPOSITORY/BENCHMARKS",
  "REPOSITORY/LAYOUT",
]
path = "packages/rust/libs/docs/content/src/docs/architecture.md"

[[surfaces]]
features = ["REPOSITORY/BENCHMARKS"]
path = "packages/rust/libs/docs/content/src/docs/benchmarks.md"

[[surfaces]]
features = ["CLI/CHECK", "REPOSITORY/BENCHMARKS"]
