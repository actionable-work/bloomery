manual = false
design = "design/results.md#current-state-report"

[requirements.ears]
type = "ubiquitous"
system = "the current-state report"
action = "list builder, sample count, mean, standard deviation, minimum, maximum, and ratio to Bloomery per scenario"

[[requirements]]
id = "REPOSITORY-BENCHMARKS-RESULTS-003"
