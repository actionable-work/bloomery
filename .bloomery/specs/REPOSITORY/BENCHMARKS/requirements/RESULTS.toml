group = "RESULTS"

[[requirements]]
id = "REPOSITORY-BENCHMARKS-RESULTS-001"
title = "Each run regenerates the current-state report"
manual = false
design = "design/results.md#current-state-report"

[requirements.ears]
type = "event"
trigger = "a benchmark run completes"
system = "the benchmark harness"
action = "regenerate benchmarks/results/current.md from that run"

[[requirements]]
id = "REPOSITORY-BENCHMARKS-RESULTS-002"
