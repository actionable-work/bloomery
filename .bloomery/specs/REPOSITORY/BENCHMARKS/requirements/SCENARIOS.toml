manual = false
design = "design/scenarios.md#mutation-contract"

[requirements.ears]
type = "ubiquitous"
system = "each benchmark mutation"
action = "edit only the declared target without changing profile, features, linker, platform, or undeclared dependencies"

[[requirements]]
id = "REPOSITORY-BENCHMARKS-SCENARIOS-013"
title = "Preparation regenerates derived dependency inputs"
manual = false
design = "design/scenarios.md#mutation-contract"

[requirements.ears]
type = "event"
trigger = "a scenario changes dependency data"
system = "the benchmark harness"
action = "regenerate Cargo and Bloomery locks and any builder-generated Nix before timing"

[[requirements]]
id = "REPOSITORY-BENCHMARKS-SCENARIOS-014"
title = "Check scenarios use builder-idiomatic granularity"
manual = false
design = "design/scenarios.md#check-scenarios"

[requirements.ears]
type = "ubiquitous"
system = "the benchmark check scenarios"
action = "run Bloomery per-crate checks and each alternative's own check granularity"

[[requirements]]
id = "REPOSITORY-BENCHMARKS-SCENARIOS-015"
title = "Input-changing scenarios force a cache miss"
manual = false
design = "design/scenarios.md#mutation-contract"

[requirements.ears]
type = "ubiquitous"
system = "each scenario that changes workspace or dependency inputs"
action = "change the affected inputs so the timed build cannot reuse a cached result"

[[requirements]]
id = "REPOSITORY-BENCHMARKS-SCENARIOS-016"
title = "External dependency changes evict changed outputs"
manual = false
design = "design/scenarios.md#mutation-contract"

[requirements.ears]
type = "event"
trigger = "a scenario changes an external dependency"
system = "the benchmark harness"
action = "delete the changed derivations from the store before timing while keeping unchanged and fixed-output paths"
