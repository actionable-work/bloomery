schema_version = 1
group = "UNUSED"

[[requirements]]
id = "PARSER-CONFIGURATION-UNUSED-001"
title = "Unused dependency policy is catalogued"
manual = false
design = "design/unused-dependencies.md"
ears = { type = "ubiquitous", system = "the configuration schema", action = "catalogue checks.unusedDependencies.enable and checks.unusedDependencies.exceptions with their types, documentation, and recommended defaults" }

[[requirements]]
id = "PARSER-CONFIGURATION-UNUSED-002"
title = "Unused dependency policy defaults are applied"
manual = false
design = "design/unused-dependencies.md"
ears = { type = "ubiquitous", system = "configuration loading", action = "default checks.unusedDependencies.enable to false and checks.unusedDependencies.exceptions to an empty list when omitted" }

[[requirements]]
id = "PARSER-CONFIGURATION-UNUSED-003"
title = "Unused dependency exceptions use package names"
manual = false
design = "design/unused-dependencies.md"
ears = { type = "ubiquitous", system = "configuration loading", action = "accept only unique bare Cargo package names in checks.unusedDependencies.exceptions" }

[[requirements]]
id = "PARSER-CONFIGURATION-UNUSED-004"
title = "Invalid unused dependency policy is rejected"
manual = false
design = "design/unused-dependencies.md"
ears = { type = "ubiquitous", system = "configuration loading", action = "reject unknown unused dependency policy keys, malformed package names, and values of invalid types as ConfigurationError before formatting or analysis" }

[[requirements]]
id = "PARSER-CONFIGURATION-UNUSED-005"
title = "Unused dependency policy validates when disabled"
manual = false
design = "design/unused-dependencies.md"
ears = { type = "ubiquitous", system = "configuration loading", action = "validate checks.unusedDependencies configuration even when checks.unusedDependencies.enable is false" }

[[requirements]]
id = "PARSER-CONFIGURATION-UNUSED-006"
title = "Compiler unused dependency switch is catalogued"
manual = false
design = "design/unused-dependencies.md"
ears = { type = "ubiquitous", system = "the configuration schema", action = "catalogue checks.unusedDependencies.compiler as a boolean that defaults to false and is recommended true" }

[[requirements]]
id = "PARSER-CONFIGURATION-UNUSED-007"
title = "Nix loader maps the compiler switch"
manual = false
design = "design/unused-dependencies.md"
ears = { type = "ubiquitous", system = "the Nix configuration loader", action = "map checks.unusedDependencies.compiler and checks.unusedDependencies.exceptions to the workspace options and reject a non-boolean compiler value" }
