group = "COMMANDS"

[[requirements]]
id = "CLI-CONFIG-COMMANDS-001"
title = "The CLI exposes config"
manual = false
design = "design/editing.md#invocation"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "expose the config subcommand"

