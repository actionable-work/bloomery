manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "require --title and --ears on spec add and accept optional --design and --manual"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-020"
title = "Spec set addresses a field positionally"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept a field name and value as positional arguments on spec set"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-021"
title = "Disk accepts an explicit system scope"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept repeatable --system values on disk for full-tree measurements"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-022"
title = "Disk system scope rejects an addressed derivation"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "unwanted_behavior"
trigger = "disk is invoked with both --system and a derivation argument"
system = "the bloomery CLI"
action = "return a usage error"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-023"
title = "Disk accepts a measurement scope"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --scope with all, runtime, or build on disk, defaulting to all"

