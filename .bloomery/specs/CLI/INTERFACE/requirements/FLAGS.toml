design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "unwanted_behavior"
trigger = "config upgrade is invoked with both --dry-run and --diff"
system = "the bloomery CLI"
action = "return a usage error"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-015"
title = "Spec list filters by area"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --area on spec list"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-016"
title = "Spec list filters by feature"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --feature on spec list"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-017"
title = "Spec list filters by group"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --group on spec list"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-018"
