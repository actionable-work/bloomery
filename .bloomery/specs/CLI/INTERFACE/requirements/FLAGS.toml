group = "FLAGS"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-001"
title = "Review defaults to human-readable output"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "use human-readable output when --json is omitted"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-002"
title = "Review accepts JSON output"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --json for review"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-003"
title = "JSON output uses one shared option"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "use --json rather than command-specific JSON or format selectors"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-005"
title = "Commands expose help flags"
manual = false
design = "design/flags.md"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "provide -h and --help on commands"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-006"
title = "Shared-purpose flags are consistent across commands"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "expose the same --json option for init, check, review, and sync"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-007"
title = "Nested check commands share JSON selection"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept the global --json flag before or after nested check subcommands"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-008"
title = "Execution flags are not retrieval flags"
manual = false
design = "design/flags.md"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "reject execution-only check options on retained-result retrieval commands"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-009"
title = "Invalid numeric options are rejected"
manual = false
design = "design/flags.md"

[requirements.ears]
type = "unwanted_behavior"
trigger = "jobs or limit is not a positive integer, or offset is not a nonnegative integer"
system = "the bloomery CLI"
action = "return a usage error"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-010"
title = "Config list filters by prefix"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --prefix on config list"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-011"
title = "Config upgrade accepts a dry run"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --dry-run on config upgrade"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-012"
title = "Config-only flags are rejected elsewhere"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "unwanted_behavior"
trigger = "--prefix is used outside config list, or --dry-run or --diff is used outside config upgrade"
system = "the bloomery CLI"
action = "return a usage error"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-013"
title = "Config upgrade accepts a diff"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --diff on config upgrade"

[[requirements]]
id = "CLI-INTERFACE-FLAGS-014"
title = "Config diff and dry-run are mutually exclusive"
manual = false
design = "design/flags.md#shared-purpose-options"

[requirements.ears]
type = "unwanted_behavior"
trigger = "config upgrade is invoked with both --dry-run and --diff"
system = "the bloomery CLI"
action = "return a usage error"
