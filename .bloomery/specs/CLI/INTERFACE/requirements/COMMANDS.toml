manual = false
design = "design/commands.md#flake-presence-preflight"

[requirements.ears]
type = "unwanted_behavior"
trigger = "a command other than init, including parser help, is requested from a current directory without flake.nix"
system = "the bloomery CLI"
action = "stop before command handling with a nonzero error instructing the user to set up a Bloomery flake.nix"
