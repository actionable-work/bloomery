group = "OUTPUT"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-001"
title = "Human-readable terminal output is colored"
manual = false
design = "design/output.md#human-readable-output"

[requirements.ears]
type = "event"
trigger = "a command writes human-readable output to a terminal and NO_COLOR is not set"
system = "the bloomery CLI"
action = "colorize statuses, labels, source locations, progress, warnings, and failures to improve readability"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-002"
title = "Color is disabled for redirected and machine output"
manual = false
design = "design/output.md#human-readable-output"

[requirements.ears]
type = "unwanted_behavior"
trigger = "the current output stream is not a terminal, NO_COLOR is non-empty, TERM is dumb, or --json is selected"
system = "the bloomery CLI"
action = "omit ANSI color codes from output"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-003"
title = "Every application command accepts JSON output"
manual = false
design = "design/output.md"

[requirements.ears]
type = "ubiquitous"
system = "the bloomery CLI"
action = "accept --json for init, check, disk, review, sync, and spec"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-004"
title = "Check JSON reports status"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "check is invoked with --json"
system = "bloomery check"
action = "emit one JSON object identifying the run status"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-005"
title = "Review JSON emits the stable review catalog"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "review is invoked with --json"
system = "bloomery review"
action = "emit the stable JSON array of manual review items"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-006"
title = "Sync JSON emits a structured result or failure"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "sync is invoked with --json"
system = "bloomery sync"
action = "emit structured lock, update, notice, stage, or failure information"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-007"
title = "JSON mode does not mix in human progress output"
manual = false
design = "design/output.md"

[requirements.ears]
type = "unwanted_behavior"
trigger = "an application command is invoked with --json"
system = "the bloomery CLI"
action = "refrain from writing human-formatted progress, banners, or diagnostics to stdout"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-008"
title = "Missing-flake errors honor JSON mode"
manual = false
design = "design/output.md"

[requirements.ears]
type = "event"
trigger = "a non-init command or parser help is requested without flake.nix and --json is selected"
system = "the bloomery CLI"
action = "emit one JSON error with guidance to set up a Bloomery flake.nix"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-009"
title = "Config JSON emits a structured result or failure"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "a config command is invoked with --json"
system = "bloomery config"
action = "emit structured key, value, configured, change, or added-key information"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-010"
title = "Spec JSON emits a structured result or failure"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "a spec command is invoked with --json"
system = "bloomery spec"
action = "emit structured record, field, change, or error information"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-011"
title = "Spec trace JSON emits tied test references"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "spec trace is invoked with --json"
system = "bloomery spec"
action = "emit one record per requested requirement with its scanner, path, and line references"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-012"
title = "Spec candidates JSON emits untied test sites"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "spec candidates is invoked with --json"
system = "bloomery spec"
action = "emit an array of untied test sites with scanner, name, path, and line"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-013"
title = "Disk JSON reports byte quantities"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "disk is invoked with --json"
system = "bloomery disk"
action = "emit one object with the measured byte total, the measured systems, the addressed derivation, and any unmeasured derivations"

[[requirements]]
id = "CLI-INTERFACE-OUTPUT-014"
title = "Disk JSON reports the category tree"
manual = false
design = "design/output.md#json-contracts"

[requirements.ears]
type = "event"
trigger = "disk is invoked with --json"
system = "bloomery disk"
action = "emit the category tree with each entry's name, bytes, and unmeasured status"
