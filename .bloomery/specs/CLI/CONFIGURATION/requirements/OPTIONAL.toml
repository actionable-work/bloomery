group = "OPTIONAL"

[[requirements]]
id = "CLI-CONFIGURATION-OPTIONAL-001"
title = "Missing configuration uses validated defaults"
manual = false
design = "design/config-file.md#missing-file-defaults"

[requirements.ears]
type = "unwanted_behavior"
trigger = "the configuration file is absent"
system = "Bloomery"
action = "use the validated defaults for the specs root and all scanners"

[[requirements]]
id = "CLI-CONFIGURATION-OPTIONAL-002"
title = "Partial configuration inherits defaults"
manual = false
design = "design/config-file.md#partial-configuration"

[requirements.ears]
type = "event"
trigger = "a configuration file omits a table or key"
system = "Bloomery"
action = "use the same default value as an empty configuration"

[[requirements]]
id = "CLI-CONFIGURATION-OPTIONAL-003"
title = "Invalid present configuration remains an error"
manual = false
design = "design/config-file.md#error-handling"

[requirements.ears]
type = "unwanted_behavior"
trigger = "a present configuration file is unreadable, malformed, or invalid"
system = "Bloomery"
action = "report a ConfigurationError instead of substituting defaults"

[[requirements]]
id = "CLI-CONFIGURATION-OPTIONAL-004"
title = "Workspace loads without a configuration file"
manual = false
design = "design/config-file.md#workspace-loading"

[requirements.ears]
type = "ubiquitous"
system = "Bloomery"
action = "load a structurally valid workspace without requiring config.toml"
