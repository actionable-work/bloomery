group = "PROGRESS"

[[requirements]]
id = "CLI-CHECK-PROGRESS-001"
title = "User terminals receive live metrics"
manual = false
design = "design/progress.md#eligibility"

[requirements.ears]
type = "state"
state = "check execution uses human mode with terminal stderr, a non-dumb TERM, and no active CI marker"
system = "bloomery check"
action = "display live check and derivation metrics on stderr"

[[requirements]]
id = "CLI-CHECK-PROGRESS-002"
title = "Redirected progress streams stay quiet"
manual = false
design = "design/progress.md#eligibility"

[requirements.ears]
