group = "DETAIL"

[[requirements]]
id = "CLI-CHECK-DETAIL-001"
title = "Runs are retained outside source"
manual = false
design = "design/details.md#storage-and-identity"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check"
action = "retain results and captured logs in a workspace-scoped user cache outside tracked source"

[[requirements]]
id = "CLI-CHECK-DETAIL-002"
title = "Completed runs are immutable"
manual = false
design = "design/details.md#storage-and-identity"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check"
action = "leave completed run manifests immutable"

[[requirements]]
id = "CLI-CHECK-DETAIL-003"
title = "Concurrent runs have distinct identities"
manual = false
design = "design/details.md#storage-and-identity"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check"
action = "allocate distinct run identities and storage for concurrent executions"

[[requirements]]
id = "CLI-CHECK-DETAIL-004"
title = "Run retrieval supports explicit selection"
manual = false
design = "design/details.md#failures"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check failure retrieval"
action = "accept --run to select a retained workspace run"

[[requirements]]
id = "CLI-CHECK-DETAIL-005"
