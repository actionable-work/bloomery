manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check list"
action = "discover selectable check IDs without executing tests or builds"

[[requirements]]
id = "CLI-CHECK-SELECT-008"
title = "Listing applies selectors"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check list"
action = "apply the execution command's selector matching semantics"

[[requirements]]
