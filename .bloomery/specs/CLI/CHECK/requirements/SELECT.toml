manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check list"
action = "page check IDs using zero-based offset and positive limit values"

[[requirements]]
id = "CLI-CHECK-SELECT-017"
title = "Catalog listing exposes continuation"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check list"
action = "report actual offset, total IDs, and nullable next offset in both output formats"

[[requirements]]
id = "CLI-CHECK-SELECT-018"
title = "Catalog listing has a byte ceiling"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check list"
action = "limit each complete serialized human or JSON page to 8 KiB"

[[requirements]]
id = "CLI-CHECK-SELECT-019"
title = "Catalog listing is sorted"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check list"
action = "order discovered check IDs lexicographically before paging"

[[requirements]]
id = "CLI-CHECK-SELECT-020"
title = "Empty system check catalogs are valid"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "event"
trigger = "an explicitly selected system exposes an empty checks set"
system = "bloomery check"
