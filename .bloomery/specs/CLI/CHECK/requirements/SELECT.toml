manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "unwanted_behavior"
trigger = "an explicitly selected system has no checks output"
system = "bloomery check"
action = "report an error rather than silently skipping that system"

[[requirements]]
id = "CLI-CHECK-SELECT-012"
title = "Partial selection is identified"
manual = false
design = "design/execution.md#exit-and-setup-failures"

[requirements.ears]
type = "event"
trigger = "check selectors or explicit system selection are supplied"
system = "bloomery check"
