group = "SELECT"

[[requirements]]
id = "CLI-CHECK-SELECT-001"
title = "Default selection includes all available checks"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "event"
trigger = "no check selectors are supplied"
system = "bloomery check"
action = "select both static checks and every available Nix check for the default system"

[[requirements]]
id = "CLI-CHECK-SELECT-002"
title = "Exact selectors are repeatable"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check"
action = "accept repeatable --check exact-ID selectors"

[[requirements]]
id = "CLI-CHECK-SELECT-003"
