manual = false
design = "design/execution.md#exit-and-setup-failures"

[requirements.ears]
type = "unwanted_behavior"
trigger = "execution selection contains zero checks"
system = "bloomery check"
action = "return a usage error rather than report success"

[[requirements]]
id = "CLI-CHECK-SELECT-015"
title = "Explicit Nix selection requires a flake"
manual = false
design = "design/execution.md#check-catalog"

[requirements.ears]
type = "unwanted_behavior"
trigger = "Nix checks are explicitly selected in a workspace without flake.nix"
system = "bloomery check"
action = "report an error rather than skip the requested checks"

[[requirements]]
id = "CLI-CHECK-SELECT-016"
