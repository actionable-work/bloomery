manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check"
action = "accept anchored case-sensitive check selectors using * and ? globs"

[[requirements]]
id = "CLI-CHECK-SELECT-004"
title = "Selectors form a deduplicated union"
manual = false
design = "design/execution.md#selection"

[requirements.ears]
type = "ubiquitous"
system = "bloomery check"
action = "combine selector matches by union without duplicate check execution"

[[requirements]]
id = "CLI-CHECK-SELECT-005"
