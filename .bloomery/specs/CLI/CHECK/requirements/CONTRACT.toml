group = "CONTRACT"

[[requirements]]
id = "CLI-CHECK-CONTRACT-001"
title = "Check rejects invalid workspace structure"
manual = false
design = "design/pipeline.md"

[requirements.ears]
type = "event"
trigger = "specification management and checks.specifications.enable are enabled and workspace structure invariants are invalid"
system = "bloomery check"
action = "return failure when workspace structure invariants are invalid"

[[requirements]]
id = "CLI-CHECK-CONTRACT-002"
title = "Check rejects invalid traceability"
manual = false
design = "design/pipeline.md"

[requirements.ears]
type = "event"
trigger = "specification management and checks.specifications.enable are enabled and traceability invariants are invalid"
system = "bloomery check"
action = "return failure when traceability invariants are invalid"

[[requirements]]
id = "CLI-CHECK-CONTRACT-003"
title = "Check succeeds without spec management"
manual = false
design = "design/pipeline.md#static-validation-pipeline"
ears = { type = "event", trigger = "specification management is disabled and formatting and every selected check pass", system = "bloomery check", action = "return success without a specification tree" }

[[requirements]]
id = "CLI-CHECK-CONTRACT-004"
title = "Disabled specification validation omits static checks"
manual = false
design = "design/execution.md#check-catalog"

[requirements.ears]
type = "event"
trigger = "specification management is disabled or checks.specifications.enable resolves to false"
system = "bloomery check"
action = "exclude static:structure and static:traceability from the check catalog"

[[requirements]]
id = "CLI-CHECK-CONTRACT-005"
title = "Disabled spec management skips evidence scanning"
manual = false
design = "design/pipeline.md#static-validation-pipeline"

[requirements.ears]
type = "event"
trigger = "specification management is disabled"
system = "bloomery check"
action = "run no specification or evidence scanner pass"
