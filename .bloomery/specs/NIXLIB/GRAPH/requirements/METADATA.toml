group = "METADATA"

[[requirements]]
id = "NIXLIB-GRAPH-METADATA-001"
title = "Metadata-only dependency variants are compiled"
manual = false
design = "design/metadata-check.md#metadata-only-crate-variants"

[requirements.ears]
type = "ubiquitous"
system = "the crate builder"
action = "compile a non-proc-macro dependency crate with rustc --emit=metadata when producing its metadata-only variant"

