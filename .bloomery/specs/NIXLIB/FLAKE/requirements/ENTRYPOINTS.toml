group = "ENTRYPOINTS"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-001"
title = "Flake exports mkFlake as its only constructor"
manual = false
design = "design/entry-points.md#exported-flake-attributes"

[requirements.ears]
type = "ubiquitous"
system = "the Bloomery flake"
action = "export mkFlake as its only library constructor"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-002"
title = "Flake exposes no mkLib constructor"
manual = false
design = "design/entry-points.md#exported-flake-attributes"

[requirements.ears]
type = "ubiquitous"
system = "the Bloomery flake"
action = "expose no mkLib constructor"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-003"
title = "mkFlake accepts nixpkgs, root, systems, overrides, and extraOutputs"
manual = false
design = "design/entry-points.md#mkflake"

[requirements.ears]
type = "ubiquitous"
system = "the mkFlake constructor"
action = "accept nixpkgs, root, an optional systems list, an optional overrides set, and an optional extraOutputs callback"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-004"
title = "mkFlake reads build settings from config.toml"
manual = false
design = "design/entry-points.md#mkflake"

[requirements.ears]
type = "ubiquitous"
system = "the mkFlake constructor"
action = "read every non-Nix build setting from .bloomery/config.toml"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-005"
title = "mkFlake instantiates each configured system"
manual = false
design = "design/entry-points.md#mkflake"

[requirements.ears]
type = "ubiquitous"
system = "the mkFlake constructor"
action = "evaluate one workspace per configured system using that system's nixpkgs.legacyPackages"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-006"
title = "mkFlake defaults to the supported systems"
manual = false
design = "design/entry-points.md#systems-and-output-mapping"

[requirements.ears]
type = "ubiquitous"
system = "the mkFlake constructor"
action = "select x86_64-linux, aarch64-linux, and aarch64-darwin when the systems argument is omitted"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-007"
title = "mkFlake maps workspace outputs to flake attributes"
manual = false
design = "design/entry-points.md#systems-and-output-mapping"

[requirements.ears]
type = "ubiquitous"
system = "the mkFlake constructor"
action = "expose per-system packages, apps, checks, and devShells.default from the evaluated workspaces"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-008"
title = "Disabled development shells omit the default shell"
manual = false
design = "design/entry-points.md#systems-and-output-mapping"

[requirements.ears]
type = "event"
trigger = "the workspace disables its development shell"
system = "the mkFlake constructor"
action = "omit devShells.<system>.default while retaining packages, apps, and checks for that system"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-009"
title = "extraOutputs receives system and workspace helpers"
manual = false
design = "design/entry-points.md#extraoutputs"

[requirements.ears]
type = "ubiquitous"
system = "the mkFlake constructor"
action = "call extraOutputs with eachSystem and perSystemWorkspace"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-010"
title = "extraOutputs can add or replace flake outputs"
manual = false
design = "design/entry-points.md#extraoutputs"

[requirements.ears]
type = "event"
trigger = "extraOutputs returns an attribute set"
system = "the mkFlake constructor"
action = "merge the returned attributes after the generated flake attributes so they can add or override outputs"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-011"
title = "Flake exposes no per-system builder attributes"
manual = false
design = "design/entry-points.md#exported-flake-attributes"

[requirements.ears]
type = "ubiquitous"
system = "the Bloomery flake"
action = "expose no per-system lib or mkLib builder attributes"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-012"
title = "Flake exposes no flake-parts integration"
manual = false
design = "design/entry-points.md#exported-flake-attributes"

[requirements.ears]
type = "ubiquitous"
system = "the Bloomery flake"
action = "expose no flakeModules or flakeModule integration"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-013"
title = "Flake exposes no public lib helper surface"
manual = false
design = "design/entry-points.md#exported-flake-attributes"

[requirements.ears]
type = "ubiquitous"
system = "the Bloomery flake"
action = "expose no public lib helper attributes"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-014"
title = "mkFlake rejects non-Nix workspace option arguments"
manual = false
design = "design/entry-points.md#mkflake"

[requirements.ears]
type = "unwanted_behavior"
trigger = "a build-table setting other than overrides is passed as a mkFlake argument"
system = "the mkFlake constructor"
action = "reject the argument instead of treating it as configuration"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-015"
title = "Exported mkFlake injects the Bloomery CLI"
manual = false
design = "design/entry-points.md#bloomery-cli-injection"

[requirements.ears]
type = "ubiquitous"
system = "the exported mkFlake constructor"
action = "add the bloomery binary built from the Bloomery flake's own workspace to every generated default development shell"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-016"
title = "Exported mkFlake exposes no CLI opt-out"
manual = false
design = "design/entry-points.md#bloomery-cli-injection"

[requirements.ears]
type = "ubiquitous"
system = "the exported mkFlake constructor"
action = "accept no argument that enables or disables Bloomery CLI injection"

[[requirements]]
id = "NIXLIB-FLAKE-ENTRYPOINTS-017"
title = "Root flake evaluates without CLI injection"
manual = false
design = "design/entry-points.md#self-hosting"

[requirements.ears]
type = "event"
trigger = "the Bloomery repository evaluates its own workspace"
system = "the root flake.nix"
action = "use an internal constructor binding created without Bloomery CLI injection"
