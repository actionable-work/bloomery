group = "OPTIONS"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-001"
title = "Source paths default below the workspace root"
manual = false
design = "design/workspace-options.md#source-and-files"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "default build.cargoToml and build.cargoLock to paths below root and auto-detect build.bloomeryLock when it exists"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-002"
title = "build.members restricts built members"
manual = false
design = "design/workspace-options.md#source-and-files"

[requirements.ears]
type = "event"
trigger = "build.members lists crate names"
system = "the workspace builder"
action = "restrict generated crate derivations to those workspace members"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-003"
title = "Toolchain options are configurable"
manual = false
design = "design/workspace-options.md#toolchain-and-linker"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept rustc, clippy, cargo, lld, mold, stdenv, and linker settings"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-004"
title = "Default linker follows the platform"
manual = false
design = "design/workspace-options.md#toolchain-and-linker"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "use lld by default on Linux and the system linker elsewhere unless a linker is selected explicitly"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-005"
title = "Profile options are type-checked"
manual = false
design = "design/workspace-options.md#compilation-profiles"
ears = { type = "ubiquitous", system = "the workspace option module", action = "type-check build.profile.release, build.profile.dev, and build.profile.test settings for optimization, LTO, codegen units, panic strategy, stripping, debug info, target CPU, overflow checks, linker, and link arguments" }

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-006"
title = "Profiles lower to rustc flags"
manual = false
design = "design/workspace-options.md#compilation-profiles"
ears = { type = "ubiquitous", system = "the workspace builder", action = "lower the effective release, dev, and test profile settings into rustc flags for their respective derivations" }

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-007"
title = "Manifest profiles provide the option base"
manual = false
design = "design/workspace-options.md#compilation-profiles"

[requirements.ears]
type = "event"
trigger = "Cargo.toml declares profile settings"
system = "the workspace builder"
action = "use those settings as the base profile while explicit options override them"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-008"
title = "Package visibility toggles are configurable"
manual = false
design = "design/workspace-options.md#package-visibility"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "expose build.libPackages and build.devPackages as the canonical visibility toggles"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-009"
title = "Library visibility controls library packages"
manual = false
design = "design/workspace-options.md#package-visibility"

[requirements.ears]
type = "event"
trigger = "build.libPackages is enabled"
system = "the workspace builder"
action = "expose <crate>:lib packages for workspace crates with a library entrypoint"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-010"
title = "Dev visibility controls dev apps"
manual = false
design = "design/workspace-options.md#package-visibility"

[requirements.ears]
type = "event"
trigger = "build.devPackages is enabled"
system = "the workspace builder"
action = "generate dev-profile apps for workspace binaries"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-011"
title = "Per-phase flag lists are configurable"
manual = false
design = "design/workspace-options.md#flags"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept extra rustc, test, clippy, doc, and doctest flags"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-012"
title = "Overrides expose per-crate settings"
manual = false
design = "design/workspace-options.md#overrides"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept per-crate native build inputs, build inputs, runtime tool dependencies, rustc and rustdoc flags, environment, features, fileset, src, release and dev profile fragments, assets, asset directories, and additive test settings"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-013"
title = "Overrides merge with explicit values winning"
manual = false
design = "design/workspace-options.md#overrides"

[requirements.ears]
type = "event"
trigger = "a crate has built-in, colocated, and explicit overrides"
system = "the workspace builder"
action = "merge them in that order and let explicit values win"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-014"
title = "Development shell options are configurable"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept development shell enablement, extra packages, and a shell hook"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-015"
title = "Check options are configurable"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept checks.enable, checks.packages.enable, and checks.lockFreshness.enable"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-016"
title = "Feature resolution options are configurable"
manual = false
design = "design/workspace-options.md#feature-resolution"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept build.unify and features.cratesIoIndex"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-017"
title = "Workspace dependency check defaults off"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "default checks.workspaceDependencies.enable to false"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-018"
title = "Default features check defaults off"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "default checks.noDefaultFeatures.enable to false"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-019"
title = "Formatter ordering options are configurable"
manual = false
design = "design/workspace-options.md#formatter-ordering"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept per-formatter enablement and before and after ordering lists"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-020"
title = "Optimization options are configurable"
manual = false
design = "design/workspace-options.md#optimization"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept per-binary enablement, a repository-relative training script, per-system gates with per-system target CPUs, and independent PGO and BOLT stage tables"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-021"
title = "Per-crate training overrides are configurable"
manual = false
design = "design/workspace-options.md#optimization"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "accept training native build inputs, build inputs, environment, and an additive fixture fileset under a per-crate optimize namespace"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-022"
title = "Package check inclusion defaults to off"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "default checks.packages.enable to false"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-023"
title = "Crate check defaults off"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "default checks.crates.enable to false"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-024"
title = "Generated checks default off"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace option module"
action = "default checks.enable to false"

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-025"
title = "Lock freshness check defaults off"
manual = false
design = "design/workspace-options.md#development-shell-and-checks"
ears = { type = "ubiquitous", system = "the workspace option module", action = "default checks.lockFreshness.enable to false" }

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-026"
title = "Release profile defaults to opt-level 3"
manual = false
design = "design/workspace-options.md#compilation-profiles"
ears = { type = "ubiquitous", system = "the workspace builder", action = "compile release-profile crates with -Copt-level=3 unless a release profile layer sets optLevel" }

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-027"
title = "Crate codegen fields apply to every profile crate"
manual = false
design = "design/workspace-options.md#compilation-profiles"
ears = { type = "ubiquitous", system = "the workspace builder", action = "apply the optLevel, codegenUnits, debuginfo, and overflowChecks fields of a profile to every crate compiled with that profile" }

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-028"
title = "Link fields apply to binaries only"
manual = false
design = "design/workspace-options.md#compilation-profiles"
ears = { type = "ubiquitous", system = "the workspace builder", action = "apply the lto, panic, strip, linker, and linkArgs fields of a profile only to binary links" }

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-029"
title = "Extra rustc flags apply to every crate"
manual = false
design = "design/workspace-options.md#flags"
ears = { type = "ubiquitous", system = "the workspace builder", action = "pass build.flags.rustc to every crate compilation in the release, dev, and test profiles" }

[[requirements]]
id = "NIXLIB-FLAKE-OPTIONS-030"
title = "Flag lists reject profile-owned settings"
manual = false
design = "design/workspace-options.md#flags"
ears = { type = "unwanted_behavior", trigger = "build.flags.rustc, build.flags.test, or build.flags.clippy sets opt-level, codegen-units, debuginfo, or overflow-checks", system = "the workspace builder", action = "fail evaluation with an error naming the profile fields to set instead" }
