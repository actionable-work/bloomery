group = "OUTPUTS"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-001"
title = "Packages expose binary derivations"
manual = false
design = "design/output-contract.md#packages"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "expose one release package derivation named after each discovered workspace binary"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-002"
title = "Library packages are gated by visibility"
manual = false
design = "design/output-contract.md#packages"

[requirements.ears]
type = "event"
trigger = "library package visibility is enabled"
system = "the workspace builder"
action = "expose a <crate>:lib package for each workspace crate with a library entrypoint"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-003"
title = "Default package prefers the default binary"
manual = false
design = "design/output-contract.md#packages"

[requirements.ears]
type = "event"
trigger = "a workspace has at least one binary"
system = "the workspace builder"
action = "expose packages.default as the binary named default when present or the first discovered binary otherwise"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-004"
title = "Dev profile derivations are not packages"
manual = false
design = "design/output-contract.md#packages"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "keep dev-profile derivations out of the packages output"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-005"
title = "Apps expose binaries, dev binaries, and documentation"
manual = false
design = "design/output-contract.md#apps"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "expose <bin> apps for release binaries, <bin>:dev apps when dev packages are enabled, and <crate>:doc apps for documentation servers"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-006"
title = "Apps include a default entry"
manual = false
design = "design/output-contract.md#apps"

[requirements.ears]
type = "event"
trigger = "a workspace has at least one binary"
system = "the workspace builder"
action = "expose apps.default for the preferred binary"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-007"
title = "Checks cover each workspace crate"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled"
system = "the workspace builder"
action = "expose <crate>:test, <crate>:clippy, and <crate>:doc checks for every workspace crate"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-008"
title = "Doctest checks require a library entrypoint"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled"
system = "the workspace builder"
action = "expose a <crate>:doctest check only for workspace crates with a library entrypoint"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-009"
title = "Package checks are gated independently"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks.packages.enable is disabled"
system = "the workspace builder"
action = "omit <bin>:bin and <crate>:lib checks while retaining the remaining checks"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-010"
title = "Lock validation is part of the check set"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled"
system = "the workspace builder"
action = "expose a workspace:lock validation check"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-011"
title = "No recursive check output is generated"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "generate no recursive bloomery:check output"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-012"
title = "Crate derivations are exposed as outputs"
manual = false
design = "design/output-contract.md#derivation-and-metadata-outputs"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "expose release crate derivations as crates and dev workspace crate derivations as cratesDev"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-013"
title = "Lock and configuration models are exposed"
manual = false
design = "design/output-contract.md#derivation-and-metadata-outputs"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "expose the parsed lock model as lock and the evaluated options as config"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-014"
title = "Enabled development shell contains the toolchain"
manual = false
design = "design/output-contract.md#development-shell"

[requirements.ears]
type = "event"
trigger = "the development shell is enabled"
system = "the workspace builder"
action = "return a shell containing rustc, clippy, cargo, nix-fast-build, the selected linker, and user packages with the configured shell hook"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-015"
title = "Disabled development shell is null"
manual = false
design = "design/output-contract.md#development-shell"

[requirements.ears]
type = "event"
trigger = "the development shell is disabled"
system = "the workspace builder"
action = "return a null devShell output"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-016"
title = "App entries declare an app program"
manual = false
design = "design/output-contract.md#apps"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "shape every app entry as an attribute set with type = \"app\" and a program path"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-017"
title = "Default development shell includes the Bloomery CLI"
manual = false
design = "design/output-contract.md#development-shell"

[requirements.ears]
type = "event"
trigger = "the development shell is enabled"
system = "the workspace builder"
action = "add the Bloomery CLI derivation to the default development shell package set"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-018"
title = "Workspaces without a CLI derivation omit it"
manual = false
design = "design/output-contract.md#development-shell"

[requirements.ears]
type = "event"
trigger = "the workspace builder receives no Bloomery CLI derivation"
system = "the workspace builder"
action = "generate the default development shell without the Bloomery CLI while retaining the toolchain and user packages"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-019"
title = "Workspace dependency check is gated independently"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled and checks.workspaceDependencies.enable is disabled"
system = "the workspace builder"
action = "omit the workspace:dependencies check while retaining the remaining checks"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-020"
title = "Enabled workspace dependency check is generated"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled and checks.workspaceDependencies.enable is enabled"
system = "the workspace builder"
action = "expose a workspace:dependencies check"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-021"
title = "Default features check is gated independently"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled and checks.noDefaultFeatures.enable is disabled"
system = "the workspace builder"
action = "omit the workspace:default-features check while retaining the remaining checks"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-022"
title = "Enabled default features check is generated"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled and checks.noDefaultFeatures.enable is enabled"
system = "the workspace builder"
action = "expose a workspace:default-features check"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-023"
title = "Enabled optimization replaces the exported package"
manual = false
design = "design/output-contract.md#packages"

[requirements.ears]
type = "event"
trigger = "an optimize entry is enabled"
system = "the workspace builder"
action = "expose the optimized derivation as <bin> in packages"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-024"
title = "Optimized binaries keep package checks on release"
manual = false
design = "design/output-contract.md#packages"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "keep package checks on the release build for an optimized binary"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-025"
title = "Enabled optimization updates the release app"
manual = false
design = "design/output-contract.md#apps"

[requirements.ears]
type = "event"
trigger = "an optimize entry is enabled"
system = "the workspace builder"
action = "expose the optimized derivation as the binary's release app while dev apps stay on the dev profile"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-026"
title = "Package checks are omitted by default"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks are enabled and checks.packages.enable is omitted"
system = "the workspace builder"
action = "omit <bin>:bin and <crate>:lib checks while retaining the remaining checks"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-027"
title = "Packages are the production build targets"
manual = false
design = "design/output-contract.md#packages"

[requirements.ears]
type = "ubiquitous"
system = "the workspace builder"
action = "expose the exact production derivation, including an optimized variant, as each package target"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-028"
title = "Crate check is gated independently"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks.crates.enable is disabled"
system = "the workspace builder"
action = "omit <crate>:check entries while retaining the remaining checks"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-029"
title = "Enabled crate check is generated"
manual = false
design = "design/output-contract.md#checks"

[requirements.ears]
type = "event"
trigger = "checks.crates.enable is enabled"
system = "the workspace builder"
action = "expose a <crate>:check entry for every workspace crate"

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-030"
title = "Enabled policy checks are generated per member"
manual = false
design = "design/output-contract.md#checks"
ears = { type = "event", trigger = "a dependency policy is enabled and checks.enable is true", system = "the workspace builder", action = "expose a separate <member>:vulnerabilities, <member>:licenses, or <member>:bans check for each selected member and enabled policy" }

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-031"
title = "Check catalog output records catalog facts"
manual = false
design = "design/output-contract.md#check-catalog"
ears = { type = "ubiquitous", system = "mkFlake", action = "expose bloomeryCatalog.<system> whose catalog attribute records non-legacy check attribute names, legacy bloomery:check presence, the core:treefmt-check derivation path, the formatter derivation path and executable, and the healthSources projection" }

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-032"
title = "Check plan output records derivation paths"
manual = false
design = "design/output-contract.md#check-catalog"
ears = { type = "ubiquitous", system = "mkFlake", action = "expose bloomeryPlan.<system> whose plan attribute records each check attribute except core:treefmt-check and bloomery:check with its derivation path or an evaluation failure marker" }

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-033"
title = "Catalog records are readable without building"
manual = false
design = "design/output-contract.md#check-catalog"
ears = { type = "ubiquitous", system = "mkFlake", action = "define bloomeryCatalog and bloomeryPlan as derivations whose records nix derivation show reads without realizing anything, for every evaluated system" }

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-034"
title = "Catalog records reference recorded derivation files"
manual = false
design = "design/output-contract.md#check-catalog"
ears = { type = "ubiquitous", system = "mkFlake", action = "record derivation paths in catalog records as plain store references without output dependencies" }

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-035"
title = "Catalog records cover composed checks"
manual = false
design = "design/output-contract.md#check-catalog"
ears = { type = "ubiquitous", system = "mkFlake", action = "compute bloomeryCatalog and bloomeryPlan from the final checks.<system>, including extraOutputs, elevated sub-flake, and Billet checks" }

[[requirements]]
id = "NIXLIB-FLAKE-OUTPUTS-036"
title = "Plan evaluation stays within its budget"
manual = false
design = "design/output-contract.md#check-catalog"
ears = { type = "unwanted_behavior", trigger = "evaluating bloomeryPlan.<system> for a budgeted fixture workspace in a fresh evaluator exceeds that fixture's recorded thunk budget", system = "the plan budget check", action = "fail and report the measured thunk count against the budget" }
