[build]
libPackages = false
devPackages = true

[checks]
workspaceDependencies = false
noDefaultFeatures = false

[profile.release]
optLevel = 3
lto = "fat"
codegenUnits = 1

[scanners.nix]
enabled = true
paths = ["*.nix", "lib/**/*.nix", "nix/**/*.nix", "tests/**/*.nix"]

[scanners.rust]
enabled = true
paths = ["packages/rust/**/*.rs"]
