[checks.specifications.crates."packages/rust/libs/shared/check/Cargo.toml"]
features = [
  "CLI/CHECK",
  "PARSER/WORKSPACE",
] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/shared/model/Cargo.toml"]
