  "PARSER/CONFIGURATION",
  "PARSER/REQUIREMENTS",
] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/shared/scanning/Cargo.toml"]
features = ["PARSER/SCANNING"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/shared/schema/Cargo.toml"]
features = [
  "PARSER/CONFIGURATION",
  "PARSER/REQUIREMENTS",
] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/shared/test-macros/Cargo.toml"]
exclude = true                                                                 # Exclude this crate from ownership gates with a reason.
reason = "Test attribute support; this crate provides no production behavior." # Reason for this specification policy exception or ownership.

[checks.specifications.crates."packages/rust/libs/shared/workspace/Cargo.toml"]
features = [
  "PARSER/REQUIREMENTS",
  "PARSER/WORKSPACE",
] # Feature identifiers owned by this crate.

[checks.specifications.requirementExceptions.CLI-CHECK-PROGRESS-009]
maxTests = 7                                                                                  # Validating-site limit for this requirement.
reason = "Exactly-once completion is exercised across scheduling and terminal outcome paths." # Reason for this specification policy exception or ownership.

[checks.specifications.requirementExceptions.CLI-INTERFACE-PRESENTATION-014]
maxTests = 12                                                                                # Validating-site limit for this requirement.
reason = "The same metadata omission rule is verified across independent command renderers." # Reason for this specification policy exception or ownership.

[checks.vulnerabilities]
ignoreAdvisories = [] # RustSec advisory IDs suppressed by vulnerability checks.

[checks.vulnerabilities.informational]
notice = "warn"       # Outcome for other informational advisories.
unknown = "warn"      # Outcome for unrecognized advisory categories.
unmaintained = "warn" # Outcome for unmaintained-crate advisories.
unsound = "warn"      # Outcome for unsoundness advisories.

[checks.workspaceDependencies]
enable = true # Validate workspace dependency declarations.

[devShell]
enable = true  # Generate the default development shell.
packages = []  # Additional nixpkgs packages in the development shell.
shellHook = "" # Shell hook run when entering the development shell.

