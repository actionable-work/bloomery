version = 3

[build]
cargoLock = "Cargo.lock" # Repository-relative path to Cargo.lock.
cargoToml = "Cargo.toml" # Repository-relative path to the Cargo workspace manifest.
devPackages = true       # Generate dev-profile apps for workspace binaries.
libPackages = false      # Expose <crate>:lib packages for workspace libraries.
profileName = "release"  # Active Cargo profile name for release builds.
unify = false            # Unify workspace features like Cargo's resolver.

[build.flags]
clippy = ["-Dwarnings"] # Extra rustc flags for clippy runs.
doc = ["-Dwarnings"]    # Extra rustdoc flags for documentation builds.
doctest = []            # Extra rustdoc flags for doctests.
rustc = []              # Extra rustc flags for every crate compilation.
test = []               # Extra rustc flags for test compilation.

[build.profile.release]
codegenUnits = 1 # release profile: number of codegen units
lto = "fat"      # release profile: link-time optimization mode
optLevel = 3     # release profile: optimization level (0-3, s, z)

[build.toolchain]
cargo = "cargo"   # nixpkgs attribute path for cargo.
clippy = "clippy" # nixpkgs attribute path for clippy.
lld = "lld"       # nixpkgs attribute path for lld.
mold = "mold"     # nixpkgs attribute path for mold.
rustc = "rustc"   # nixpkgs attribute path for rustc.
stdenv = "stdenv" # nixpkgs attribute path for the C toolchain.

[checks]
enable = true   # Generate workspace checks.
profile = "dev" # Check graph mode: test-profile workspace crates (dev), every crate (cargo), or the release graph (release).

[checks.bans]
allow = []      # Package selectors permitted by the package ban check.
deny = []       # Package selectors rejected by the package ban check.
enable = true   # Check package allowlists, denylists, and exceptions.
exceptions = [] # Package selectors exempt from package ban rules.

[checks.clippySuppressions]
allow = []    # Exact Clippy lint names permitted in inline allow attributes.
enable = true # Enable the inline Clippy suppression policy check.

[checks.codeHealth]
baseline = ".bloomery/code-health-summary.json" # Repository-relative reviewed code health snapshot.
# Soft production SLOC limit per crate used by code health scoring.
crateSlocLimit = 1500       # Soft per-crate production SLOC limit used by code health scoring.
cyclomaticLimit = 10        # Soft cyclomatic complexity limit used by code health scoring.
duplicateMinTokens = 64     # Minimum exact token window considered a duplicate (at least 16).
duplicationFreeRatio = 0.02 # Duplicate body-token fraction without a scoring penalty (0–1).
enable = true               # Enable the source-based code health check.
functionTokensLimit = 250   # Soft callable body token limit used by code health scoring.
# Hard production SLOC limit per crate.
maxCrateSloc = 5000      # Hard per-crate production SLOC limit.
maxCyclomatic = 40       # Hard per-callable cyclomatic complexity limit.
maxFunctionTokens = 1000 # Hard per-callable body token limit.
maxNesting = 8           # Hard per-callable branch nesting limit.
maxRegression = 2        # Maximum allowed decrease from a reviewed score (0–100 points).
minCrateScore = 80       # Minimum passing code health score for each crate (0–100).
minWorkspaceScore = 80   # Minimum passing aggregate code health score (0–100).
nestingLimit = 4         # Soft branch nesting limit used by code health scoring.

[checks.codeHealth.weights]
complexity = 25  # Relative code health score weight for cyclomatic complexity.
crateSize = 30   # Relative code health score weight for production SLOC per crate.
duplication = 15 # Relative code health score weight for duplicated code.
nesting = 10     # Relative code health score weight for branch nesting.
size = 20        # Relative code health score weight for callable body size.

[checks.crates]
enable = true # Generate per-crate type-check entries.

[checks.licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
] # SPDX license IDs or license-with-exception pairs allowed by the license check.
deny = [
] # SPDX license IDs or license-with-exception pairs rejected by the license check.
enable = true # Check dependency license expressions against compatibility policy.
exceptions = [
] # Package selectors exempt from global license allow and deny rules.

[checks.lockFreshness]
enable = true # Fail evaluation when bloomery.lock is out of date.

[checks.noDefaultFeatures]
enable = true # Require default features to be disabled on workspace dependencies.

[checks.packages]
enable = false # Include binary and library build checks.

# Authored-link policies run in static:traceability.
# A validating site is a Rust test function, Playwright call, or Nix evidence file.
# Limit both tests per requirement and requirement IDs per test to five.
# testExceptions overrides a per-test limit for a repository-relative path glob
# and optional exact test name. Named matches take precedence over path-only matches;
# overlapping matches in either category use alphabetical exception-label order.
# Keep exceptions narrowly scoped and explain each one with a reason.
# Each mapped crate defaults to at least one automated requirement and one linked site.
# Untied sites are advisory in report mode; deny mode enforces maxUntiedTests.
# Inspect associations and exception reasons with bloomery spec trace --report.
# Policy details and examples: specs/CLI/CHECK/design/spec-quality.md.
# Test breadth and exception examples: specs/CLI/CHECK/design/test-breadth.md.
[checks.specifications]
enable = true                # Enable static specification validation checks.
maxRequirementsPerTest = 5   # Maximum distinct automated requirement IDs per authored validating site.
maxTestsPerRequirement = 5   # Maximum distinct authored validating sites per automated requirement.
maxUntiedTests = 0           # Maximum nonexempt untied sites in deny mode.
requireCrateOwnership = true # Require an ownership mapping or exclusion for every selected workspace crate.
untiedTests = "report"       # Untied-test policy: off, advisory reporting, or a failing budget.

