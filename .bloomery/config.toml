[checks.specifications.crates."packages/rust/libs/cli/spec/Cargo.toml"]
features = ["CLI/SPEC"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/sync/Cargo.toml"]
features = ["CLI/SYNC"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/docs/consistency/Cargo.toml"]
features = ["DOCS/CONSISTENCY"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/docs/content/Cargo.toml"]
