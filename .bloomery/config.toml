[checks.specifications.crates."packages/rust/libs/cli/check-storage/Cargo.toml"]
features = ["CLI/CHECK"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/check-support/Cargo.toml"]
features = ["CLI/CHECK"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/cli-app/Cargo.toml"]
features = ["CLI/INTERFACE"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/cli-output/Cargo.toml"]
features = ["CLI/INTERFACE"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/cli-parser/Cargo.toml"]
features = ["CLI/INTERFACE"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/cli-types/Cargo.toml"]
features = ["CLI/INTERFACE"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/config/Cargo.toml"]
features = ["CLI/CONFIG"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/disk/Cargo.toml"]
features = ["CLI/DISK"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/init/Cargo.toml"]
features = ["CLI/INIT"] # Feature identifiers owned by this crate.

[checks.specifications.crates."packages/rust/libs/cli/review/Cargo.toml"]
