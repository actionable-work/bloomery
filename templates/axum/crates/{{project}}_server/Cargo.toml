[dependencies]
axum = { version = "0.7", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "net",
  "rt-multi-thread",
] }

[package]
name = "{{project}}_server"
version = "0.1.0"
edition = "2024"
