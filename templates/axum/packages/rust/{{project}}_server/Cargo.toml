[dependencies]
axum = { default-features = false, features = [
  "http1",
  "json",
  "tokio",
], version = "0.7" }
serde = { features = ["derive"], version = "1" }
serde_json = "1"
tokio = { default-features = false, features = [
  "net",
  "rt-multi-thread",
], version = "1" }

[package]
edition = "2024"
name = "{{project}}_server"
version = "0.1.0"
