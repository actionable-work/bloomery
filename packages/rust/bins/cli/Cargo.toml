[[bin]]
name = "bloomery"
path = "src/main.rs"

[dependencies]
bloomery-check = { path = "../../crates/check" }
bloomery-model = { path = "../../crates/model" }
bloomery-review = { path = "../../crates/review" }
bloomery-workspace = { path = "../../crates/workspace" }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"

[package]
name = "bloomery-cli"
version = "0.1.0"
edition = "2024"
