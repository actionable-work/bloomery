<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hearth-grad" x1="16" y1="52" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="stone-grad" x1="12" y1="12" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="42" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="ember-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Furnace Chimney / Shaft (Clay & Stone) -->
  <path d="M22 10 L42 10 L48 54 L16 54 Z" fill="url(#stone-grad)" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Outer furnace bands (Reinforcing iron hoops) -->
  <path d="M20 20 L44 20" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 34 L46 34" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 48 L48 48" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Hearth Glow Base -->
  <circle cx="32" cy="42" r="14" fill="url(#glow)"/>

  <!-- Arch Hearth Opening -->
  <path d="M25 54 C25 42, 39 42, 39 54 Z" fill="#080a0d" stroke="#f97316" stroke-width="1.5"/>

  <!-- Molten Bloom (The glowing lump of reduced iron) -->
  <path d="M27 52 C27 45, 37 45, 37 52 C37 54, 27 54, 27 52 Z" fill="url(#hearth-grad)" filter="url(#ember-filter)"/>

  <!-- Rising Heat Flames & Sparks -->
  <circle cx="32" cy="18" r="1.5" fill="#fde047" opacity="0.9"/>
  <circle cx="28" cy="14" r="1.2" fill="#fb923c" opacity="0.8"/>
  <circle cx="36" cy="12" r="1.8" fill="#f97316" opacity="0.95"/>
  <circle cx="32" cy="6" r="2.2" fill="#fde047" filter="url(#ember-filter)"/>
  <circle cx="26" cy="7" r="1" fill="#ea580c" opacity="0.7"/>
  <circle cx="38" cy="5" r="1.2" fill="#fbbf24" opacity="0.85"/>
</svg>
