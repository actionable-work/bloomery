version = 2

[build]
devPackages = true
libPackages = true
unify = false

[checks]
enable = true

[checks.clippySuppressions]
enable = true

[checks.codeHealth]
enable = true

[checks.crates]
enable = true

[checks.lockFreshness]
enable = true

[checks.noDefaultFeatures]
enable = false

[checks.packages]
enable = true

[checks.specifications]
enable = false

[checks.workspaceDependencies]
enable = false
