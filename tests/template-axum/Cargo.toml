[workspace]
members = ["packages/rust/template_axum", "packages/rust/template_axum_server"]
resolver = "2"

[workspace.dependencies]
app_server = { default-features = false, path = "packages/rust/template_axum_server" }
axum = { default-features = false, features = [
  "http1",
  "json",
  "tokio",
], version = "0.7" }
serde = { default-features = false, features = [
  "derive",
  "std",
], version = "1" }
serde_json = { default-features = false, features = ["std"], version = "1" }
tokio = { default-features = false, features = [
  "net",
  "rt-multi-thread",
], version = "1" }
